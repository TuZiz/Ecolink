name: Ecolink
version: "${version}"
main: ym.ecolink.Ecolink
api-version: "1.20"
folia-supported: true
authors: [ ymxc ]
description: "Cross-server async economy plugin with multi-currency, idempotent recharge, configurable shop, and PostgreSQL/MySQL storage."
softdepend: [ Vault, PlaceholderAPI ]

commands:
  el:
    description: "Ecolink root command"
    aliases: [ eco, ecolink ]
    usage: "/el help"
  money:
    description: "Vault primary currency command"
    usage: "/money [player]|pay <player> <amount>|top [page]|give <player> <amount>|set <player> <amount>|take <player> <amount>"
  balance:
    description: "Check balances"
    aliases: [ bal ]
    usage: "/balance [player]"
  pay:
    description: "Pay another player"
    usage: "/pay <player> <amount>"
  baltop:
    description: "Show the richest accounts"
    usage: "/baltop [page]"

permissions:
  ecolink.pay:
    default: true
  ecolink.balance.others:
    default: op
  ecolink.ledger:
    default: op
  ecolink.ledger.others:
    default: op
  ecolink.recharge:
    default: op
  ecolink.migrate:
    default: op
  ecolink.admin:
    default: op
