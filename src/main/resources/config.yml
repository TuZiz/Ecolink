# PostgreSQL remains the recommended primary storage for cross-server economy clusters.
# MySQL is still supported when you need it.

server:
  id: "server-1"

async:
  worker-threads: 4

language:
  locale: "zh_CN"
  fallback-locale: "en_US"
  directory: "lang"

economy:
  # Legacy single-currency fallback. Only used when currencies.list is missing.
  currency-symbol: "$"
  scale: 2
  starting-balance: "0.00"
  cache-ttl-millis: 2000

currencies:
  default-key: "coins"
  enabled:
    - "coins"
    - "gems"
  management:
    command-enabled: true
    allow-create: true
    allow-delete: true
    protected:
      - "coins"
  list:
    coins:
      display-name: "Coins"
      symbol: "$"
      scale: 2
      starting-balance: "0.00"
      transferable: true
      vault-primary: true
    gems:
      display-name: "Gems"
      symbol: "G"
      scale: 0
      starting-balance: "0"
      transferable: false
      vault-primary: false
    tokens:
      display-name: "Tokens"
      symbol: "T"
      scale: 0
      starting-balance: "0"
      transferable: true
      vault-primary: false

shop:
  enabled: true
  products:
    vip_week:
      enabled: true
      display-name: "VIP 7 Days"
      currency: "coins"
      price: "5000.00"
      commands:
        - "lp user <player> parent addtemp vip 7d"
    gem_pack:
      enabled: true
      display-name: "Gem Pack x100"
      currency: "coins"
      price: "1200.00"
      commands:
        - "el give <player> gems 100"

feature:
  top-page-size: 10
  ledger-page-size: 10

compatibility:
  vault:
    enabled: true
    sync-timeout-millis: 1500
  placeholderapi:
    enabled: true

sync:
  redis:
    enabled: false
    host: "127.0.0.1"
    port: 6379
    database: 0
    password: ""
    channel: "ecolink:balance-sync"
    timeout-millis: 2000

storage:
  type: "postgresql"
  host: "127.0.0.1"
  port: 5432
  database: "ecolink"
  schema: "public"
  username: "postgres"
  password: "change-me"
  table-prefix: "ecolink_"
  pool:
    maximum-size: 8
    minimum-idle: 2
    connection-timeout-millis: 10000

migration:
  cmi-directory: "plugins/CMI"
  essentials-directory: "plugins/Essentials"
