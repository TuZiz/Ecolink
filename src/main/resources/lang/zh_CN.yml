    insufficient-funds: '<prefix><#FF6B6B>余额不足。</#FF6B6B><gray>当前余额：</gray><white><amount></white>'
    operation-failed: '<prefix><#FF6B6B>操作失败：</#FF6B6B><white><error></white>'
  validation:
    invalid-amount: '<prefix><#FF6B6B>金额格式无效：</#FF6B6B><white><input></white>'
