      take: '<prefix><#7CFFCB>已为</#7CFFCB><white><player></white><gray>扣减余额，当前为</gray><white><amount></white>'
    recharge:
      no-permission: '<prefix><#FF6B6B>你没有充值权限。</#FF6B6B>'
      blank-transaction-id: '<prefix><#FF6B6B>事务号不能为空。</#FF6B6B>'
      applied: '<prefix><#7CFFCB>充值已入账</#7CFFCB><gray>（事务 <transaction>）</gray><white><player></white><gray> → </gray><white><amount></white><gray>（余额 <balance>）</gray>'
      duplicate: '<prefix><#FFD166>重复事务已安全回放</#FFD166><gray>（事务 <transaction>）</gray><white><player></white><gray> → </gray><white><amount></white><gray>（余额 <balance>）</gray>'
    migrate:
      no-permission: '<prefix><#FF6B6B>你没有迁移权限。</#FF6B6B>'
      unknown-source: '<prefix><#FF6B6B>未知迁移来源：</#FF6B6B><white><source></white>'
      started: '<prefix><#FFD166>迁移已在后台开始执行。</#FFD166>'
      summary: '<prefix><#7CFFCB>迁移完成</#7CFFCB><white><source></white><gray>（发现 <discovered>，新增 <inserted>，覆盖 <updated>，跳过 <skipped>，失败 <failed>）</gray>'
      report: '<prefix><white><source></white><gray>发现 <discovered>，新增 <inserted>，覆盖 <updated>，跳过 <skipped>，失败 <failed></gray>'
      sample-error: '<prefix><#FF6B6B>样例错误：</#FF6B6B><white><error></white>'
    ledger:
      no-permission: '<prefix><#FF6B6B>你没有权限查看流水。</#FF6B6B>'
