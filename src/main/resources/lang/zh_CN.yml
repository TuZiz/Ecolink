      empty: '<prefix><gray>这一页没有流水记录。</gray>'
      line: '<prefix><gray>[<time>]</gray><#FFD166><action></#FFD166><white><amount></white><gray> → </gray><white><balance></white><dark_gray>（<server>，<reason>，事务 <transaction>）</dark_gray>'
    currencies:
      header: '<prefix><gradient:#4FC3F7:#7CFFCB><bold>货币列表</bold></gradient>'
      line: '<prefix><#7CFFCB><key></#7CFFCB><gray>（<display>）</gray><gray>初始余额：</gray><white><amount></white><dark_gray><tags></dark_gray>'
      tags:
        default: '默认'
        vault: 'Vault'
        no-pay: '禁转'
