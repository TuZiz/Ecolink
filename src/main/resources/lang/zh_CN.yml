    admin-take: '<prefix><#FFD166>/ecolink take ＜player＞ ＜amount＞ [currency]</#FFD166><gray> - 扣减余额</gray>'
    recharge: '<prefix><#FFD166>/ecolink recharge ＜player＞ ＜currency＞ ＜amount＞ ＜transactionId＞ [reason...]</#FFD166><gray> - 幂等充值</gray>'
