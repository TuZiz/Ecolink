prefix: '<gradient:#4FC3F7:#7CFFCB><bold>Ecolink</bold></gradient><gray> • </gray>'

usage:
  root: '/ecolink <set|add|take|recharge|migrate|ledger|currencies|help>'
  balance-other: '/balance <player> [currency]'
  pay: '/pay <player> <amount> [currency]'
  admin-set: '/ecolink set <player> <amount> [currency]'
  admin-add: '/ecolink add <player> <amount> [currency]'
  admin-take: '/ecolink take <player> <amount> [currency]'
  recharge: '/ecolink recharge <player> <currency> <amount> <transactionId> [reason...]'
  migrate: '/ecolink migrate <cmi|essentials|all> [overwrite]'
  ledger: '/ecolink ledger <player> [currency] [page]'

messages:
