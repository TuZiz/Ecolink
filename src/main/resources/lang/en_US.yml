prefix: '<gradient:#4FC3F7:#7CFFCB><bold>Ecolink</bold></gradient><gray> • </gray>'

usage:
  root: '/ecolink <set|add|take|recharge|migrate|ledger|currencies|help>'
  balance-other: '/balance <player> [currency]'
  pay: '/pay <player> <amount> [currency]'
  admin-set: '/ecolink set <player> <amount> [currency]'
  admin-add: '/ecolink add <player> <amount> [currency]'
  admin-take: '/ecolink take <player> <amount> [currency]'
  recharge: '/ecolink recharge <player> <currency> <amount> <transactionId> [reason...]'
  migrate: '/ecolink migrate <cmi|essentials|all> [overwrite]'
  ledger: '/ecolink ledger <player> [currency] [page]'

messages:
  system:
    startup-failed: '<prefix><#FF6B6B>Plugin startup failed:</#FF6B6B> <white><error></white>'
    starting: '<prefix><#FFD166>Plugin is still starting. Please retry in a moment.</#FFD166>'
  common:
    usage: '<prefix><#FFD166>Usage:</#FFD166> <white><usage></white>'
    account-not-found: '<prefix><#FF6B6B>Account not found.</#FF6B6B>'
    account-not-found-selector: '<prefix><#FF6B6B>Account not found:</#FF6B6B> <white><selector></white>'
    insufficient-funds: '<prefix><#FF6B6B>Insufficient balance.</#FF6B6B> <gray>Current:</gray> <white><amount></white>'
    operation-failed: '<prefix><#FF6B6B>Operation failed:</#FF6B6B> <white><error></white>'
  validation:
    invalid-amount: '<prefix><#FF6B6B>Invalid amount:</#FF6B6B> <white><input></white>'
    amount-positive: '<prefix><#FF6B6B>Amount must be greater than 0.</#FF6B6B>'
    amount-non-negative: '<prefix><#FF6B6B>Amount must be 0 or greater.</#FF6B6B>'
    unknown-currency: '<prefix><#FF6B6B>Unknown currency:</#FF6B6B> <white><currency></white>'
    invalid-page: '<prefix><#FF6B6B>Invalid page:</#FF6B6B> <white><input></white>'
  labels:
    not-available: 'n/a'
  help:
    header: '<prefix><gradient:#4FC3F7:#7CFFCB><bold>Command Guide</bold></gradient>'
    balance: '<prefix><#7CFFCB>/balance [player] [currency]</#7CFFCB> <gray>- view balances</gray>'
    pay: '<prefix><#7CFFCB>/pay ＜player＞ ＜amount＞ [currency]</#7CFFCB> <gray>- transfer currency</gray>'
    baltop: '<prefix><#7CFFCB>/baltop [currency] [page]</#7CFFCB> <gray>- view top balances</gray>'
    ledger: '<prefix><#7CFFCB>/ecolink ledger [player] [currency] [page]</#7CFFCB> <gray>- view ledger entries</gray>'
    currencies: '<prefix><#7CFFCB>/ecolink currencies</#7CFFCB> <gray>- list currencies</gray>'
    admin-set: '<prefix><#FFD166>/ecolink set ＜player＞ ＜amount＞ [currency]</#FFD166> <gray>- set balance</gray>'
    admin-add: '<prefix><#FFD166>/ecolink add ＜player＞ ＜amount＞ [currency]</#FFD166> <gray>- add balance</gray>'
    admin-take: '<prefix><#FFD166>/ecolink take ＜player＞ ＜amount＞ [currency]</#FFD166> <gray>- take balance</gray>'
    recharge: '<prefix><#FFD166>/ecolink recharge ＜player＞ ＜currency＞ ＜amount＞ ＜transactionId＞ [reason...]</#FFD166> <gray>- idempotent recharge</gray>'
    migrate: '<prefix><#FFD166>/ecolink migrate ＜cmi|essentials|all＞ [overwrite]</#FFD166> <gray>- import old data</gray>'
  command:
    balance:
      no-permission-others: '<prefix><#FF6B6B>You do not have permission to view other balances.</#FF6B6B>'
      self: '<prefix><#7CFFCB>Balance</#7CFFCB> <gray>(<currency>)</gray> <white><amount></white>'
      other: '<prefix><white><player></white> <gray>(<currency>)</gray> <white><amount></white>'
    pay:
      no-permission: '<prefix><#FF6B6B>You do not have permission to transfer currency.</#FF6B6B>'
      currency-locked: '<prefix><#FF6B6B><currency> cannot be transferred.</#FF6B6B>'
      self: '<prefix><#FF6B6B>You cannot pay yourself.</#FF6B6B>'
      sent: '<prefix><#7CFFCB>Paid</#7CFFCB> <white><target></white> <white><amount></white> <gray>(remaining <balance>)</gray>'
      received: '<prefix><#7CFFCB>Received</#7CFFCB> <white><amount></white> <gray>from</gray> <white><player></white>'
    baltop:
      no-permission: '<prefix><#FF6B6B>You do not have permission to view the leaderboard.</#FF6B6B>'
      header: '<prefix><gradient:#4FC3F7:#7CFFCB><bold>Balance Top</bold></gradient> <gray><currency> · page <page></gray>'
      empty: '<prefix><gray>No account data on this page.</gray>'
      line: '<prefix><#FFD166>#<rank></#FFD166> <white><player></white> <gray>-</gray> <white><amount></white>'
    admin:
      no-permission: '<prefix><#FF6B6B>You do not have admin permission.</#FF6B6B>'
      set: '<prefix><#7CFFCB>Balance set for</#7CFFCB> <white><player></white> <gray>→</gray> <white><amount></white>'
      add: '<prefix><#7CFFCB>Balance added for</#7CFFCB> <white><player></white> <gray>→</gray> <white><amount></white>'
      take: '<prefix><#7CFFCB>Balance removed for</#7CFFCB> <white><player></white> <gray>→</gray> <white><amount></white>'
    recharge:
      no-permission: '<prefix><#FF6B6B>You do not have recharge permission.</#FF6B6B>'
      blank-transaction-id: '<prefix><#FF6B6B>Transaction id cannot be blank.</#FF6B6B>'
      applied: '<prefix><#7CFFCB>Recharge applied</#7CFFCB> <gray>(tx <transaction>)</gray> <white><player></white> <gray>→</gray> <white><amount></white> <gray>(balance <balance>)</gray>'
      duplicate: '<prefix><#FFD166>Recharge replay accepted</#FFD166> <gray>(tx <transaction>)</gray> <white><player></white> <gray>→</gray> <white><amount></white> <gray>(balance <balance>)</gray>'
    migrate:
      no-permission: '<prefix><#FF6B6B>You do not have migration permission.</#FF6B6B>'
      unknown-source: '<prefix><#FF6B6B>Unknown migration source:</#FF6B6B> <white><source></white>'
      started: '<prefix><#FFD166>Migration started in background.</#FFD166>'
      summary: '<prefix><#7CFFCB>Migration complete</#7CFFCB> <white><source></white> <gray>(found <discovered>, inserted <inserted>, updated <updated>, skipped <skipped>, failed <failed>)</gray>'
      report: '<prefix><white><source></white> <gray>found <discovered>, inserted <inserted>, updated <updated>, skipped <skipped>, failed <failed></gray>'
      sample-error: '<prefix><#FF6B6B>Sample error:</#FF6B6B> <white><error></white>'
    ledger:
      no-permission: '<prefix><#FF6B6B>You do not have permission to view ledger entries.</#FF6B6B>'
      no-permission-others: '<prefix><#FF6B6B>You do not have permission to view other players ledger entries.</#FF6B6B>'
      header: '<prefix><gradient:#4FC3F7:#7CFFCB><bold>Ledger</bold></gradient> <white><player></white> <gray>(<currency> · page <page>)</gray>'
      empty: '<prefix><gray>No ledger entries on this page.</gray>'
      line: '<prefix><gray>[<time>]</gray> <#FFD166><action></#FFD166> <white><amount></white> <gray>→</gray> <white><balance></white> <dark_gray>(<server>, <reason>, tx <transaction>)</dark_gray>'
    currencies:
      header: '<prefix><gradient:#4FC3F7:#7CFFCB><bold>Currencies</bold></gradient>'
      line: '<prefix><#7CFFCB><key></#7CFFCB> <gray>(<display>)</gray> <gray>start:</gray> <white><amount></white> <dark_gray><tags></dark_gray>'
      tags:
        default: 'default'
        vault: 'vault'
        no-pay: 'no-pay'
