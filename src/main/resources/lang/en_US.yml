prefix: '<gradient:#4FC3F7:#7CFFCB><bold>Ecolink</bold></gradient><gray> • </gray>'

usage:
  root: '/el <me|buy|top|pay|create|give|reset|delete|reload|help>'
  money-root: '/money [player]|pay <player> <amount>|top [page]'
  balance-other: '/balance [player]'
  pay: '/pay <player> <amount>'
  pay-root: '/el pay <player> <currency> <amount>'
  top: '/el top <currency> [page]'
  buy: '/el buy <product>'
  create: '/el create <currency>'
  give: '/el give <player> <currency> <amount>'
  reset: '/el reset <player> <currency>'
  delete: '/el delete <currency>'
  reload: '/el reload'
  admin-set: '/el set <player> <amount> [currency]'
  admin-add: '/el add <player> <amount> [currency]'
  admin-take: '/el take <player> <amount> [currency]'
  recharge: '/el recharge <player> <currency> <amount> <transactionId> [reason...]'
  migrate: '/el migrate <cmi|essentials|all> [overwrite]'
  ledger: '/el ledger <player> [currency] [page]'

messages:
  system:
    startup-failed: '<prefix><#FF6B6B>Plugin startup failed:</#FF6B6B> <white><error></white>'
    starting: '<prefix><#FFD166>Plugin is still starting. Please retry in a moment.</#FFD166>'
  common:
    usage: '<prefix><#FFD166>Usage:</#FFD166> <white><usage></white>'
    player-only: '<prefix><#FF6B6B>This action can only be used by a player.</#FF6B6B>'
    account-not-found: '<prefix><#FF6B6B>Account not found.</#FF6B6B>'
    account-not-found-selector: '<prefix><#FF6B6B>Account not found:</#FF6B6B> <white><selector></white>'
    insufficient-funds: '<prefix><#FF6B6B>Insufficient balance.</#FF6B6B> <gray>Current:</gray> <white><amount></white>'
    operation-failed: '<prefix><#FF6B6B>Operation failed:</#FF6B6B> <white><error></white>'
  validation:
    invalid-amount: '<prefix><#FF6B6B>Invalid amount:</#FF6B6B> <white><input></white>'
    amount-positive: '<prefix><#FF6B6B>Amount must be greater than 0.</#FF6B6B>'
    amount-non-negative: '<prefix><#FF6B6B>Amount must be 0 or greater.</#FF6B6B>'
    unknown-currency: '<prefix><#FF6B6B>Unknown currency:</#FF6B6B> <white><currency></white>'
    invalid-page: '<prefix><#FF6B6B>Invalid page:</#FF6B6B> <white><input></white>'
  labels:
    not-available: 'n/a'
  help:
    header: '<prefix><gradient:#4FC3F7:#7CFFCB><bold>Command Guide</bold></gradient>'
    me: '<prefix><#7CFFCB>/el me</#7CFFCB> <gray>- view all of your enabled balances</gray>'
    buy: '<prefix><#7CFFCB>/el buy <product></#7CFFCB> <gray>- buy a configured product</gray>'
    top: '<prefix><#7CFFCB>/el top <currency> [page]</#7CFFCB> <gray>- view the currency leaderboard</gray>'
    pay: '<prefix><#7CFFCB>/el pay <player> <currency> <amount></#7CFFCB> <gray>- transfer currency to another player</gray>'
    create: '<prefix><#FFD166>/el create <currency></#FFD166> <gray>- enable a configured currency</gray>'
    give: '<prefix><#FFD166>/el give <player> <currency> <amount></#FFD166> <gray>- grant currency to a player</gray>'
    reset: '<prefix><#FFD166>/el reset <player> <currency></#FFD166> <gray>- reset a balance to the configured starting amount</gray>'
    delete: '<prefix><#FFD166>/el delete <currency></#FFD166> <gray>- disable a currency and purge its data</gray>'
    reload: '<prefix><#FFD166>/el reload</#FFD166> <gray>- reload config, languages, and runtime services</gray>'
  command:
    me:
      header: '<prefix><gradient:#4FC3F7:#7CFFCB><bold>Your Economy Profile</bold></gradient>'
      line: '<prefix><white><currency></white> <gray>→</gray> <white><amount></white>'
    buy:
      disabled: '<prefix><#FF6B6B>The shop is disabled.</#FF6B6B>'
      unknown-product: '<prefix><#FF6B6B>Unknown product:</#FF6B6B> <white><product></white>'
      currency-disabled: '<prefix><#FF6B6B>The product currency is not currently enabled:</#FF6B6B> <white><currency></white>'
      in-progress: '<prefix><#FFD166>A purchase is already in progress for you.</#FFD166>'
      delivery-failed: '<prefix><#FF6B6B>Purchase was charged but reward dispatch failed. Check the server log immediately.</#FF6B6B>'
      success: '<prefix><#7CFFCB>Purchase completed:</#7CFFCB> <white><product></white> <gray>for</gray> <white><amount></white> <gray>(remaining <balance>)</gray>'
    balance:
      no-permission-others: '<prefix><#FF6B6B>You do not have permission to view other balances.</#FF6B6B>'
      self: '<prefix><#7CFFCB>Balance</#7CFFCB> <gray>(<currency>)</gray> <white><amount></white>'
      other: '<prefix><white><player></white> <gray>(<currency>)</gray> <white><amount></white>'
    pay:
      no-permission: '<prefix><#FF6B6B>You do not have permission to transfer currency.</#FF6B6B>'
      currency-locked: '<prefix><#FF6B6B><currency> cannot be transferred.</#FF6B6B>'
      self: '<prefix><#FF6B6B>You cannot pay yourself.</#FF6B6B>'
      sent: '<prefix><#7CFFCB>Paid</#7CFFCB> <white><target></white> <white><amount></white> <gray>(remaining <balance>)</gray>'
      received: '<prefix><#7CFFCB>Received</#7CFFCB> <white><amount></white> <gray>from</gray> <white><player></white>'
    baltop:
      header: '<prefix><gradient:#4FC3F7:#7CFFCB><bold>Balance Top</bold></gradient> <gray><currency> · page <page></gray>'
      empty: '<prefix><gray>No account data on this page.</gray>'
      line: '<prefix><#FFD166>#<rank></#FFD166> <white><player></white> <gray>-</gray> <white><amount></white>'
    admin:
      no-permission: '<prefix><#FF6B6B>You do not have admin permission.</#FF6B6B>'
      set: '<prefix><#7CFFCB>Balance set for</#7CFFCB> <white><player></white> <gray>to</gray> <white><amount></white>'
      add: '<prefix><#7CFFCB>Balance added for</#7CFFCB> <white><player></white> <gray>to</gray> <white><amount></white>'
      take: '<prefix><#7CFFCB>Balance removed for</#7CFFCB> <white><player></white> <gray>to</gray> <white><amount></white>'
      give: '<prefix><#7CFFCB>Granted</#7CFFCB> <white><currency></white> <gray>to</gray> <white><player></white> <gray>→ current</gray> <white><amount></white>'
      reset: '<prefix><#7CFFCB>Reset</#7CFFCB> <white><player></white> <gray><currency> balance to</gray> <white><amount></white>'
    currency:
      disabled: '<prefix><#FF6B6B>Currency runtime management is disabled in config.</#FF6B6B>'
      not-configured: '<prefix><#FF6B6B>This currency is not defined in config:</#FF6B6B> <white><currency></white>'
      already-enabled: '<prefix><#FFD166><currency> is already enabled.</#FFD166>'
      created: '<prefix><#7CFFCB>Enabled currency:</#7CFFCB> <white><currency></white>'
      protected: '<prefix><#FF6B6B><currency> is protected and cannot be deleted.</#FF6B6B>'
      deleted: '<prefix><#7CFFCB>Deleted currency:</#7CFFCB> <white><currency></white> <gray>(balances <balances>, ledger <ledger>, recharges <recharges>)</gray>'
    reload:
      started: '<prefix><#FFD166>Reload started in background.</#FFD166>'
      success: '<prefix><#7CFFCB>Reload complete.</#7CFFCB>'
    recharge:
      no-permission: '<prefix><#FF6B6B>You do not have recharge permission.</#FF6B6B>'
      blank-transaction-id: '<prefix><#FF6B6B>Transaction id cannot be blank.</#FF6B6B>'
      applied: '<prefix><#7CFFCB>Recharge applied</#7CFFCB> <gray>(tx <transaction>)</gray> <white><player></white> <gray><currency></gray> <white><amount></white> <gray>(balance <balance>)</gray>'
      duplicate: '<prefix><#FFD166>Recharge replay accepted</#FFD166> <gray>(tx <transaction>)</gray> <white><player></white> <gray><currency></gray> <white><amount></white> <gray>(balance <balance>)</gray>'
    migrate:
      no-permission: '<prefix><#FF6B6B>You do not have migration permission.</#FF6B6B>'
      unknown-source: '<prefix><#FF6B6B>Unknown migration source:</#FF6B6B> <white><source></white>'
      started: '<prefix><#FFD166>Migration started in background.</#FFD166>'
      summary: '<prefix><#7CFFCB>Migration complete</#7CFFCB> <white><source></white> <gray>(found <discovered>, inserted <inserted>, updated <updated>, skipped <skipped>, failed <failed>)</gray>'
      report: '<prefix><white><source></white> <gray>found <discovered>, inserted <inserted>, updated <updated>, skipped <skipped>, failed <failed></gray>'
      sample-error: '<prefix><#FF6B6B>Sample error:</#FF6B6B> <white><error></white>'
    ledger:
      no-permission: '<prefix><#FF6B6B>You do not have permission to view ledger entries.</#FF6B6B>'
      no-permission-others: '<prefix><#FF6B6B>You do not have permission to view other players ledger entries.</#FF6B6B>'
      header: '<prefix><gradient:#4FC3F7:#7CFFCB><bold>Ledger</bold></gradient> <white><player></white> <gray>(<currency> · page <page>)</gray>'
      empty: '<prefix><gray>No ledger entries on this page.</gray>'
      line: '<prefix><gray>[<time>]</gray> <#FFD166><action></#FFD166> <white><amount></white> <gray>→</gray> <white><balance></white> <dark_gray>(<server>, <reason>, tx <transaction>)</dark_gray>'
    currencies:
      header: '<prefix><gradient:#4FC3F7:#7CFFCB><bold>Currencies</bold></gradient>'
      line: '<prefix><#7CFFCB><key></#7CFFCB> <gray>(<display>)</gray> <gray>start:</gray> <white><amount></white> <dark_gray><tags></dark_gray>'
      tags:
        default: 'default'
        vault: 'vault'
        no-pay: 'no-pay'
